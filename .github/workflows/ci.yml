name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # tsc needs @prisma/client's generated types, and eslint/tests
      # transitively import modules that reference them -- this only
      # reads prisma/schema.prisma (committed to git), no live database
      # connection needed.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test
